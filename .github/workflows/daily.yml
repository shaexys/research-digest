name: Research Digest

on:
  schedule:
    - cron: '0 11 * * *'   # 7am EDT / 6am EST — primary
    - cron: '30 11 * * *'  # 7:30am EDT / 6:30am EST — backup if primary cancelled by runner pool; dedup prevents duplicate emails
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write  # keepalive commit

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore dedup history cache
        uses: actions/cache/restore@v4
        with:
          path: sent_history.json
          key: dedup-history-${{ github.run_id }}
          restore-keys: dedup-history-

      - name: Run pipeline
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python main.py

      - name: Save dedup history cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: sent_history.json
          key: dedup-history-${{ github.run_id }}

      # GitHub disables scheduled workflows after 60 days without repo commits (happened 2026-07-05)
      - name: Monthly keepalive commit
        if: github.event.schedule == '0 11 * * *' && always()
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (prevent scheduled-workflow auto-disable)"
            git push
          fi
